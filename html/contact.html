<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - MVP KBT College</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h1>MVP KBT College</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>

                <li><a href="about.html">About</a></li>

                <li><a href="courses.html">Courses</a></li>

                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>

    <!-- Main -->
    <main>

        <!-- Contact Information -->
        <section class="contact">

            <h2>Contact Us</h2>

            <article>

                <p><strong>Address:</strong> MVP KBTCOE, Nashik, Maharashtra</p>

                <p><strong>Phone:</strong> +91 8698264580</p>

                <p><strong>Email:</strong> principal@kbtcoe.org</p>

            </article>

        </section>

        <!-- Contact Form -->
        <section class="contact">

            <h2>Send Us a Message</h2>

            <form>

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number">

                <label for="course">Course</label>
                <select id="course">

                    <option>Select Course</option>
                    <option>Computer Engineering</option>
                    <option>Information Technology</option>
                    <option>Mechanical Engineering</option>
                    <option>Civil Engineering</option>
                    <option>Electronics Engineering</option>

                </select>

                <label for="message">Message</label>

                <textarea id="message" rows="6"
                    placeholder="Write your message here..."></textarea>

                <button type="submit">Submit</button>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <p>© MVP KBT College | All Rights Reserved</p>

    </footer>

</body>

</html>
