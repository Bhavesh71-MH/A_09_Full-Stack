
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Result Management System</h1>

        <form id="resultForm">
            <input type="text" id="name" placeholder="Student Name" required>
            <input type="text" id="roll" placeholder="Roll Number" required>

            <h3>Enter Marks (Out of 100)</h3>

            <input type="number" id="maths" placeholder="Mathematics" min="0" max="100" required>
            <input type="number" id="science" placeholder="Science" min="0" max="100" required>
            <input type="number" id="english" placeholder="English" min="0" max="100" required>
            <input type="number" id="computer" placeholder="Computer" min="0" max="100" required>
            <input type="number" id="physics" placeholder="Physics" min="0" max="100" required>

            <button type="submit">Add Student Result</button>
        </form>

        <h2>Topper</h2>
        <div id="topper">No records available</div>

        <h2>Student Records</h2>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Total</th>
                    <th>Percentage</th>
                    <th>Result</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
